<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Requests · Sign in</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Request desk</a>
    </header>
    <main>
      <section class="card">
        <form id="login">
          <h1>Sign in</h1>
          <p>Review and approve purchase requests.</p>
          <label>
            Username
            <input id="username" required autocomplete="username">
          </label>
          <label>
            Password
            <input id="password" type="password" required autocomplete="current-password">
          </label>
          <button type="submit">Sign in</button>
          <p class="switch" id="registerLink" hidden>New here? <a href="/register.html">Create account →</a></p>
          <details>
            <summary>Development accounts</summary>
            <p>CLERK · junior<br><code>clerk / clerk-dev</code></p>
            <p>MANAGER · senior<br><code>manager / manager-dev</code></p>
          </details>
        </form>

        <div id="session" hidden>
          <h1>Signed in</h1>
          <p id="identity"></p>
          <button id="logout" class="secondary">Log out</button>

          <div class="actions">
            <h3>Allowed call: create request</h3>
            <label>
              Business key
              <input id="businessKey">
            </label>
            <label>
              Title
              <input id="title" value="Demo purchase">
            </label>
            <button id="create">Create request</button>

            <h3>Locked action: approve</h3>
            <label>
              Request UUID
              <input id="requestId" placeholder="Created request ID">
            </label>
            <button id="approve" class="secondary">Approve</button>
          </div>
        </div>
      </section>

      <pre id="result" aria-live="polite" hidden></pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
